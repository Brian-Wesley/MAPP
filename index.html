<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MAPP: A Multilingual Atlas of Pretraining and Post-training Data.">
    <title>MAPP — A Multilingual Atlas of Pretraining and Post-training Data</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background: #f8fafc;
        color: #172a3a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { width: 100%; max-width: 780px; }
      main::before {
        content: "";
        display: block;
        width: 48px;
        height: 4px;
        margin: 0 auto 28px;
        border-radius: 2px;
        background: #237c83;
      }
      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1.1;
      }
      .title {
        max-width: 680px;
        margin: 24px auto 0;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 400;
        line-height: 1.5;
      }
      .status {
        margin: 40px 0 0;
        color: #526271;
        font-size: 1rem;
        font-style: italic;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MAPP</h1>
      <p class="title">A Multilingual Atlas of Pretraining and Post-training Data</p>
      <p class="status">Website under development. More information coming soon.</p>
    </main>
  </body>
</html>

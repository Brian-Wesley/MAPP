<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MAPP: A Multilingual Atlas of Pretraining and Post-training Data.">
    <title>MAPP — A Multilingual Atlas of Pretraining and Post-training Data</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        padding: 48px 24px;
        background: #f8fafc;
        color: #172a3a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { width: 100%; max-width: 1100px; margin: 0 auto; }
      main::before {
        content: "";
        display: block;
        width: 48px;
        height: 4px;
        margin: 0 auto 28px;
        border-radius: 2px;
        background: #237c83;
      }
      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1.1;
      }
      .title {
        max-width: 680px;
        margin: 24px auto 0;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 400;
        line-height: 1.5;
      }
      .code-button {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 24px;
        border-radius: 8px;
        background: #237c83;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.5;
        text-decoration: none;
      }
      .code-button:hover { background: #1b6268; }
      a:focus-visible {
        outline: 3px solid #172a3a;
        outline-offset: 4px;
      }
      .figures { margin-top: 64px; text-align: left; }
      .figure-card {
        margin: 0 0 32px;
        padding: 28px;
        border: 1px solid #dce5eb;
        border-radius: 16px;
        background: #fff;
      }
      .figure-card h2 {
        margin: 0 0 12px;
        font-size: clamp(1.25rem, 3vw, 1.6rem);
        line-height: 1.35;
      }
      .figure-description {
        max-width: 900px;
        margin: 0 0 24px;
        color: #526271;
        font-size: 1rem;
        line-height: 1.7;
      }
      .figure-viewer { position: relative; }
      .format-choice {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .format-label {
        display: inline-block;
        margin: 0 6px 20px 0;
        padding: 8px 16px;
        border: 1px solid #c5d4dd;
        border-radius: 8px;
        color: #334b5c;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      .format-label:hover { background: #edf5f5; }
      .format-choice:checked + .format-label {
        border-color: #237c83;
        background: #237c83;
        color: #fff;
      }
      .format-choice:focus-visible + .format-label {
        outline: 3px solid #172a3a;
        outline-offset: 4px;
      }
      .figure-preview { display: block; }
      .figure-preview img { display: block; width: 100%; height: auto; }
      .figure-preview:focus-visible { outline-offset: 6px; }
      .pdf-view { display: none; }
      .format-choice[value="pdf"]:checked ~ .svg-view { display: none; }
      .format-choice[value="pdf"]:checked ~ .pdf-view { display: block; }
      .pdf-view iframe {
        display: block;
        width: 100%;
        height: clamp(450px, 70vw, 720px);
        border: 1px solid #dce5eb;
        border-radius: 8px;
        background: #f8fafc;
      }
      .figure-actions { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 20px; }
      .figure-actions a { color: #1b6268; font-size: 0.95rem; text-underline-offset: 3px; }
      @media (max-width: 600px) {
        body { padding: 32px 16px; }
        .figures { margin-top: 40px; }
        .figure-card { padding: 20px 16px; border-radius: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MAPP</h1>
      <p class="title">A Multilingual Atlas of Pretraining and Post-training Data</p>
      <a class="code-button" href="https://anonymous.4open.science/r/low_resource_languages_data_review-CE42/" target="_blank" rel="noopener noreferrer">Code</a>
      <section class="figures" aria-label="Research figures">
        <figure class="figure-card" aria-labelledby="profiles-title">
          <figcaption>
            <h2 id="profiles-title">Language Resource Profiles</h2>
            <p class="figure-description">A comparison of pre-training and post-training data quantities for 2,172 living languages with pre-training corpora. The plot highlights languages with no observed usable post-training datasets and groups languages into five development regimes, from expanding pre-training resources to refining both stages.</p>
          </figcaption>
          <div class="figure-viewer" role="group" aria-label="Language resource profiles format">
            <input class="format-choice" type="radio" name="profiles-format" id="profiles-svg" value="svg" checked>
            <label class="format-label" for="profiles-svg">SVG</label>
            <input class="format-choice" type="radio" name="profiles-format" id="profiles-pdf" value="pdf">
            <label class="format-label" for="profiles-pdf">PDF</label>
            <div class="svg-view">
              <a class="figure-preview" href="assets/language_resource_profiles.svg" target="_blank" rel="noopener noreferrer" aria-label="Open language resource profiles SVG at full size">
                <img src="assets/language_resource_profiles.svg" width="1130" height="560" alt="Scatter plot of pre-training and post-training data quantities, colored by five language development regimes, with a separate band for languages without usable post-training data." loading="lazy">
              </a>
              <div class="figure-actions">
                <a href="assets/language_resource_profiles.svg" target="_blank" rel="noopener noreferrer">View full-size SVG</a>
                <a href="assets/language_resource_profiles.svg" download>Download SVG</a>
              </div>
            </div>
            <div class="pdf-view">
              <iframe src="assets/language_resource_profiles.pdf#view=FitH" title="Language resource profiles PDF" loading="lazy"></iframe>
              <div class="figure-actions">
                <a href="assets/language_resource_profiles.pdf" target="_blank" rel="noopener noreferrer">Open PDF in a new tab</a>
                <a href="assets/language_resource_profiles.pdf" download>Download PDF</a>
              </div>
            </div>
          </div>
        </figure>

        <figure class="figure-card" aria-labelledby="gaps-title">
          <figcaption>
            <h2 id="gaps-title">Cross-stage Resource Gaps</h2>
            <p class="figure-description">Pre-training and post-training resource shares compared with reference shares across regions, speaker population groups, language families, and word orders. The panels show how representation changes between stages, with differences reported in percentage points.</p>
          </figcaption>
          <div class="figure-viewer" role="group" aria-label="Cross-stage resource gaps format">
            <input class="format-choice" type="radio" name="gaps-format" id="gaps-svg" value="svg" checked>
            <label class="format-label" for="gaps-svg">SVG</label>
            <input class="format-choice" type="radio" name="gaps-format" id="gaps-pdf" value="pdf">
            <label class="format-label" for="gaps-pdf">PDF</label>
            <div class="svg-view">
              <a class="figure-preview" href="assets/cross_stage_resource_gaps.svg" target="_blank" rel="noopener noreferrer" aria-label="Open cross-stage resource gaps SVG at full size">
                <img src="assets/cross_stage_resource_gaps.svg" width="496" height="468" alt="Four panels comparing reference, pre-training, and post-training shares by region, speaker population, genealogical family, and word order." loading="lazy">
              </a>
              <div class="figure-actions">
                <a href="assets/cross_stage_resource_gaps.svg" target="_blank" rel="noopener noreferrer">View full-size SVG</a>
                <a href="assets/cross_stage_resource_gaps.svg" download>Download SVG</a>
              </div>
            </div>
            <div class="pdf-view">
              <iframe src="assets/cross_stage_resource_gaps.pdf#view=FitH" title="Cross-stage resource gaps PDF" loading="lazy"></iframe>
              <div class="figure-actions">
                <a href="assets/cross_stage_resource_gaps.pdf" target="_blank" rel="noopener noreferrer">Open PDF in a new tab</a>
                <a href="assets/cross_stage_resource_gaps.pdf" download>Download PDF</a>
              </div>
            </div>
          </div>
        </figure>

        <figure class="figure-card" aria-labelledby="clusters-title">
          <figcaption>
            <h2 id="clusters-title">Cluster Resource Profiles</h2>
            <p class="figure-description">Three language clusters within each training stage are compared by data quantity, source composition, and task composition. Boxplots summarize resource quantities, while stacked bars show how data sources and tasks differ across the clusters; post-training proportions are power-transformed.</p>
          </figcaption>
          <a class="figure-preview" href="assets/combined_cluster_profiles.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open cluster resource profiles PDF">
            <img src="assets/combined_cluster_profiles.png" width="2740" height="1194" alt="Pre-training and post-training cluster comparisons, with boxplots of data quantities and stacked bars of source and task proportions." loading="lazy">
          </a>
          <div class="figure-actions">
            <a href="assets/combined_cluster_profiles.pdf" target="_blank" rel="noopener noreferrer">View PDF</a>
            <a href="assets/combined_cluster_profiles.pdf" download>Download PDF</a>
          </div>
        </figure>
      </section>
    </main>
  </body>
</html>

    <main>
      <p class="title">A Multilingual Atlas of Pretraining and Post-training Data</p>
      <h1>MAPP</h1>
      <a class="code-button" href="https://anonymous.4open.science/r/low_resource_languages_data_review-CE42/" target="_blank" rel="noopener noreferrer">Code</a>
      <section class="figures" aria-label="Research figures and tables">
        <figure class="figure-card" aria-labelledby="profiles-title">
          <img class="figure-preview" src="assets/language_resource_profiles.png" width="2400" height="1190" alt="Pre-training and post-training quantities for 2,172 living languages, colored by five development priorities, with a separate band for languages without observed usable post-training data." loading="lazy">
          <figcaption>
            <h2 id="profiles-title">Five Priorities for Developing Language Resources</h2>
            <p class="figure-description">Matching the stage-specific clusters reveals that a pre-training foundation does not guarantee task-oriented supervision. Among the 2,172 plotted languages, 1,433 have intermediate or large pre-training resources but no observed usable post-training quantity, and 274 have only small post-training resources despite stronger pre-training foundations. These gaps motivate five development regimes: <strong>Expand Pre-training</strong> through quality-controlled corpus collection; <strong>Bootstrap Post-training</strong> by building initial instruction and task datasets; <strong>Scale Up Post-training</strong> beyond small, predominantly synthetic translation slices; <strong>Diversify Post-training</strong> with independently sourced supervision across tasks; and <strong>Refine Both Stages</strong> through provenance auditing, balanced task coverage, and targeted gap filling. The 142 languages in the diversification regime illustrate why substantial example counts from reused translations still leave limited supervision breadth. Together, the regimes guide resource development toward each language's specific bottleneck, with continued human contributions alongside synthetic expansion.</p>
            <a class="figure-download" href="assets/language_resource_profiles.pdf" download aria-label="Download five language resource development priorities figure">Download figure</a>
          </figcaption>
        </figure>

                </tr>

                </tr>

                <tr class="group-start">
                  <th scope="rowgroup" rowspan="4" class="stage">Post-training</th>
                  <th scope="row">-1</th><td>6,560</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td>

                  <th scope="row">1</th><td>142</td><td>1.24 &times; 10<sup>6</sup></td><td>1.54 &times; 10<sup>6</sup></td><td>84.24</td><td>6.70</td><td>0.74</td><td>3.07</td><td>5.25</td><td>2.30 &plusmn; 2.30</td><td>0.35</td>
                </tr>

          <figcaption>
            <p class="table-notes" id="cluster-table-notes"><var>N</var> counts living languages in a reference inventory of 7,084. <var>Q</var> measures pre-training volume in Normalized Character Count (NCC) and post-training volume in response-level sample equivalents. E: Expert-Created; H: Human-Created; C: Collected-Existed; A: Human-Audited; M: Machine-Generated. The Gini coefficient summarizes inequality in resource quantity within each cluster. Cluster -1 denotes no usable observed quantity in the surveyed inventory and is excluded from clustering; dashes indicate unavailable statistics.</p>
            <p class="figure-description">These profiles establish the quantitative basis for comparing the two training stages. Usable pre-training resources cover 2,172 living languages, but post-training coverage reaches only 524. Quantity and provenance reveal distinct constraints: post-training Cluster 0 has a median of just 372 response-level sample equivalents and a 98.91% machine-generated share, while Cluster 1's 84.24% expert-created share largely reflects reused FLORES translations in xP3x. Large pre-training corpora also remain highly unequal, with a Gini coefficient of 0.99 in Cluster 2. Together, resource quantities, source percentages, and collection counts show why apparent coverage or large totals alone cannot establish broad, independently sourced supervision. The following figure visualizes these differences in distributions, provenance, and task composition.</p>
          </figcaption>
        </figure>

        <figure class="figure-card" aria-labelledby="clusters-title">
          <h2 id="clusters-title">Training Resources Differ in Both Quantity and Provenance</h2>
          <img class="figure-preview" src="assets/combined_cluster_profiles.png" width="2740" height="1194" alt="Three clusters per training stage, showing data quantity distributions and the source and task composition of each cluster." loading="lazy">
          <figcaption>
            <p class="figure-description">Across 36 pre-training and 188 post-training collections, the survey records usable resources for 2,172 and 524 living languages, respectively, out of a reference inventory of 7,084. Pre-training quantity is measured in Normalized Character Count (NCC), while post-training quantity counts response-level sample equivalents. Languages with observed resources are clustered separately within each stage using quantity and source composition; task distributions help interpret the resulting profiles. Intermediate pre-training profiles often rely on language-identification corpora, while post-training is translation-centered, ranging from small synthetic slices to reused expert translations and larger synthetic-heavy mixtures. Large totals or high expert-created shares can therefore conceal narrow supervision and dependence on shared source material. Provenance categories describe construction processes and do not directly measure data quality; post-training source and task proportions in this figure are power-transformed.</p>
            <a class="figure-download" href="assets/combined_cluster_profiles.pdf" download aria-label="Download training resource quantity and provenance figure">Download figure</a>
          </figcaption>
        </figure>

        <figure class="figure-card" aria-labelledby="cross-stage-table-title">
          <h2 id="cross-stage-table-title">How Languages Map Between Training Stages</h2>
          <p class="table-hint">Scroll horizontally to view all columns.</p>
          <div class="table-scroll" role="region" tabindex="0" aria-label="Cross-stage language counts table, horizontally scrollable">
            <table class="research-table cross-stage-table" aria-labelledby="cross-stage-table-title" aria-describedby="cross-stage-table-notes">
              <thead>
                <tr><th></th><th scope="colgroup" colspan="4">Post-training cluster</th><th></th></tr>
                <tr><th scope="col" class="row-heading">Pre-training cluster</th><th scope="col">-1</th><th scope="col">0</th><th scope="col">1</th><th scope="col">2</th><th scope="col">Total</th></tr>
              </thead>
              <tbody>
                <tr><th scope="row" class="row-heading">-1</th><td>4,912</td><td>0</td><td>0</td><td>0</td><td>4,912</td></tr>
                <tr><th scope="row" class="row-heading">0</th><td><span class="regime-tag expand" aria-label="215 languages: Expand Pre-training">215</span></td><td><span class="regime-tag expand" aria-label="22 languages: Expand Pre-training">22</span></td><td>0</td><td>0</td><td>237</td></tr>
                <tr><th scope="row" class="row-heading">1</th><td><span class="regime-tag bootstrap" aria-label="1,285 languages: Bootstrap Post-training">1,285</span></td><td><span class="regime-tag scale" aria-label="148 languages: Scale Up Post-training">148</span></td><td>0</td><td>0</td><td>1,433</td></tr>
                <tr><th scope="row" class="row-heading">2</th><td><span class="regime-tag bootstrap" aria-label="148 languages: Bootstrap Post-training">148</span></td><td><span class="regime-tag scale" aria-label="126 languages: Scale Up Post-training">126</span></td><td><span class="regime-tag diversify" aria-label="142 languages: Diversify Post-training">142</span></td><td><span class="regime-tag refine" aria-label="86 languages: Refine Both Stages">86</span></td><td>502</td></tr>
              </tbody>
              <tfoot>
                <tr><th scope="row" class="row-heading">Total</th><td>6,560</td><td>296</td><td>142</td><td>86</td><td>7,084</td></tr>
              </tfoot>
            </table>
          </div>
          <figcaption>
            <p class="table-notes" id="cross-stage-table-notes">Cells count living languages at the intersection of pre-training (rows) and post-training (columns) clusters, with three fitted clusters per stage (<var>K</var> = 3). Cluster -1 denotes no usable observed quantity. Cluster IDs are defined separately for each training stage. Highlighted cells correspond to the five development regimes below.</p>
            <div class="regime-legend" aria-label="Development regime legend">
              <span class="regime-tag expand">Expand Pre-training</span>
              <span class="regime-tag bootstrap">Bootstrap Post-training</span>
              <span class="regime-tag scale">Scale Up Post-training</span>
              <span class="regime-tag diversify">Diversify Post-training</span>
              <span class="regime-tag refine">Refine Both Stages</span>
            </div>
            <p class="figure-description">Linking the stage-specific profiles exposes gaps that separate coverage statistics cannot show. Of the 7,084 living languages in the reference inventory, 4,912 have no usable observed quantity at either stage. Among the 2,172 with pre-training resources, 1,433 have intermediate or large pre-training foundations but no usable post-training quantity, and another 274 have only small post-training resources. Even within the 502 languages in the largest pre-training cluster, post-training support ranges from absent to comparatively extensive. These intersections motivate different interventions: establishing pre-training foundations, creating initial supervision, expanding limited supervision, diversifying reused translation resources, or refining both stages. The next figure places the five regimes in the language-level resource landscape.</p>
          </figcaption>
        </figure>

        <figure class="figure-card" aria-labelledby="gaps-title">
          <h2 id="gaps-title">Linguistic Diversity Remains Unevenly Represented</h2>
          <img class="figure-preview" src="assets/cross_stage_resource_gaps.png" width="2200" height="2075" alt="Pre-training and post-training resource shares compared with speaker-share and language-count reference baselines across regions, population groups, families, and word orders." loading="lazy">
          <figcaption>
            <p class="figure-description">Beyond individual-language bottlenecks, resource shares reveal persistent disparities across language communities. Regional and population comparisons use speaker-share baselines, while family and word-order comparisons use language-count baselines. Relative to pre-training, Europe's post-training share rises by 33 percentage points, while Africa and the Americas lose 12 and 16 points. Post-training shifts toward languages with 1-100 million speakers, yet smaller-population languages remain marginal. Atlantic-Congo and Austronesian remain underrepresented relative to their language counts; among languages with known word order, SVO remains dominant and SOV stays below its reference share despite gains. These findings motivate targeted supervision collection in underserved regions and communities, alongside broader genealogical and typological coverage. Each stage's shares are normalized separately within eligible language sets, so the percentage-point differences describe changes in representation rather than absolute gains or losses in data volume.</p>
            <a class="figure-download" href="assets/cross_stage_resource_gaps.pdf" download aria-label="Download linguistic diversity representation figure">Download figure</a>
          </figcaption>
        </figure>
